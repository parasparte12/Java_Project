spring.application.name=java-project

spring.datasource.url=jdbc:postgresql://localhost:5433/code_assistant
spring.datasource.username=code_assistant_user
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Ollama Configuration
spring.ai.ollama.base-url=http://localhost:11434

# Chat Model
spring.ai.ollama.chat.model=qwen2.5:7b

# Embedding Model
spring.ai.ollama.embedding.model=mxbai-embed-large