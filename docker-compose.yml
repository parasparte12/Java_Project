
services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: java-project-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: code_assistant
      POSTGRES_USER: code_assistant_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U code_assistant_user -d code_assistant"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
